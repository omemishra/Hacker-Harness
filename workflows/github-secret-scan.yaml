name: github-secret-scan
description: Standalone GitHub OSINT, repository secret scanning (TruffleHog/Gitleaks), commit history inspection, and PR/issue leak auditing.
version: 1
inputs:
  target: github.com/org-or-repo
nodes:
  - id: authorize
    description: Operator approval to scan target GitHub repository or organization
    approval: "Authorize GitHub OSINT, repository secret auditing, and commit history scanning on {{ target }}?"

  - id: dork_and_scan
    description: GitHub dorking, TruffleHog/Gitleaks scan, and PR/issue leak check
    depends_on: [authorize]
    prompt: >-
      Perform deep GitHub secret scanning and repository audit for {{ target }}.
      skill_load code-repo-secret-audit.
      1. Run TruffleHog / Gitleaks across public repositories or local clone.
      2. Check git commit history and commit logs for removed/temporary credentials.
      3. Search pull request descriptions and comments for staging URLs, tokens, and internal references.
      4. Run organization dorking for high-risk files (.env, credentials.json, id_rsa, AWS keys).
      5. Record confirmed secret leaks and evaluate against the 7-Question Validation Gate (/validate).
      Write findings to Recon/github_secret_findings.md.
    save_output: .hacker-harness/artifacts/github-secrets-{{ target }}.md
