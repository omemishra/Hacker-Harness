[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hacker-harness"
version = "1.7.27"
description = "Authorization-aware AI terminal harness for penetration testing and bug bounty workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hacker-Harness Contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "prompt_toolkit>=3.0,<4",
]

[project.scripts]
hacker-harness = "hacker_harness.cli:app"
hh = "hacker_harness.cli:app"
hh-mcp-serve = "hacker_harness.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hacker_harness = ["seed/**/*"]
